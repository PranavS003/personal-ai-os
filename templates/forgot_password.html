<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Personal AI OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-fade auth-experience">
    <div class="page-shell auth-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <main class="auth-page">
            <section class="auth-card modern-auth-card">
                <div class="auth-copy">
                    <p class="eyebrow">Personal AI OS</p>
                    <h1>Reset your password</h1>
                    <p class="hero-text">Enter your registered email and we will send a secure reset link.</p>
                </div>

                <form method="post" action="{{ url_for('forgot_password') }}" class="daily-setup-form">
                    <div class="setup-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter your registered email" autocomplete="email" value="{{ email }}" required>
                    </div>

                    {% if error %}
                        <p class="setup-feedback error">{{ error }}</p>
                    {% endif %}

                    {% if success %}
                        <p class="setup-feedback">{{ success }}</p>
                    {% endif %}

                    <button type="submit" class="start-day-button">Send Reset Link</button>
                    <p class="auth-hint"><a href="{{ url_for('login') }}">Back to login</a></p>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
