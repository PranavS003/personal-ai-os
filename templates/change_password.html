<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Personal AI OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-fade auth-experience">
    <div class="page-shell auth-shell">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>
        <div class="ambient ambient-three"></div>

        <main class="auth-page">
            <section class="auth-card modern-auth-card">
                <div class="auth-copy">
                    <p class="eyebrow">Personal AI OS</p>
                    <h1>Change password</h1>
                    <p class="hero-text">{{ current_user_display }}, update your account password securely.</p>
                </div>

                <form method="post" action="{{ url_for('change_password') }}" class="daily-setup-form">
                    <div class="setup-group">
                        <label for="current_password">Current Password</label>
                        <input type="password" id="current_password" name="current_password" placeholder="Enter current password" autocomplete="current-password" required>
                    </div>

                    <div class="setup-group">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" autocomplete="new-password" required>
                    </div>

                    <div class="setup-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" autocomplete="new-password" required>
                    </div>

                    {% if error %}
                        <p class="setup-feedback error">{{ error }}</p>
                    {% endif %}

                    {% if success %}
                        <p class="setup-feedback">{{ success }}</p>
                    {% endif %}

                    <button type="submit" class="start-day-button">Update Password</button>
                    <p class="auth-hint"><a href="{{ url_for('dashboard') }}">Back to dashboard</a></p>
                </form>
            </section>
        </main>
    </div>
</body>
</html>
