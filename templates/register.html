{% extends "auth_base.html" %}
{% from "components/auth_fields.html" import csrf, password_field %}
{% set page_title = "Create an account" %}

{% block content %}
    <form class="auth-form" method="post" action="{{ url_for('register') }}">
        {{ csrf() }}
        <div class="auth-field">
            <label for="username">Username</label>
            <input id="username" name="username" value="{{ form_data.username }}" autocomplete="nickname" required>
        </div>
        <div class="auth-field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" value="{{ form_data.email }}" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        {{ password_field("password", "Password") }}
        <p class="auth-hint">Use at least 6 characters.</p>
        <label class="auth-checkbox">
            <input type="checkbox" name="remember"{% if remember %} checked{% endif %}>
            Keep me signed in
        </label>
        <button class="auth-primary" type="submit">Create account</button>
    </form>
    <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
